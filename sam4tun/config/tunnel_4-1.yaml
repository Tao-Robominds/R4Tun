      half_width: 700.0
      half_height_left: 680.0
      half_height_right: 520.0
    AB:
      half_width: 700.0
      half_height: 1800.0
    B1_slant_factor: 0.95
    B2_slant_factor: 1.05
  prompt_points:
    coverage_ratio: 0.95
  cropping:
    extra_margin: 150
    delta_y_extra: 50
